<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatsApp Checker</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f7f7f7; color: #222; }
    .container { max-width: 820px; margin: 0 auto; background: #fff; padding: 24px; box-shadow: 0 4px 18px rgba(0,0,0,.08); border-radius: 12px; }
    h1 { margin-top: 0; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    textarea, input, button { width: 100%; box-sizing: border-box; font-size: 1rem; }
    textarea { min-height: 140px; padding: 12px; border: 1px solid #ccc; border-radius: 8px; resize: vertical; }
    button { margin-top: 12px; padding: 12px 16px; border: 0; border-radius: 8px; background: #1c7ed6; color: white; cursor: pointer; }
    button:disabled { opacity: .65; cursor: not-allowed; }
    .row { display: grid; gap: 18px; grid-template-columns: 1fr 1fr; align-items: start; }
    .status-box, .qr-box, .result-box { background: #f4f6fb; padding: 16px; border-radius: 10px; border: 1px solid #e4e7f1; }
    .qr-box img { max-width: 100%; display: block; margin: 0 auto; }
    .result-box pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
    .small-text { font-size: .95rem; color: #555; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>WhatsApp Checker</h1>
    <div class="status-box">
      <strong>Status WhatsApp:</strong>
      <p id="wa-status">Memuat...</p>
      <button id="init-whatsapp" type="button">Inisialisasi WhatsApp</button>
      <div id="qr-section" style="margin-top:16px; display:none;">
        <strong>QR Code WhatsApp</strong>
        <div id="qr-container" class="qr-box"></div>
        <p class="small-text">Scan QR di atas dengan WhatsApp Web pada ponsel Anda.</p>
      </div>
      <div id="pair-section" style="margin-top:12px; display:none;">
        <strong>Pairing (kode)</strong>
        <div style="margin-top:8px; display:flex; gap:8px;">
          <button id="generate-pair" type="button">Buat Kode Pairing</button>
          <input id="pair-code-input" placeholder="Masukkan kode untuk konfirmasi" style="flex:1;padding:8px;border-radius:6px;border:1px solid #ccc;" />
          <button id="confirm-pair" type="button">Konfirmasi Pair</button>
        </div>
        <p id="pair-info" class="small-text" style="margin-top:8px;">Belum ada kode pairing.</p>
      </div>
    </div>

    <div style="margin-top:24px;">
      <label for="numbers-input">Masukkan nomor WA (satu per baris):</label>
      <textarea id="numbers-input" placeholder="6281234567890"></textarea>
      <button id="check-numbers-btn" type="button">Cek Nomor</button>
    </div>

    <div class="result-box" style="margin-top:20px;">
      <strong>Hasil</strong>
      <pre id="result-output">Belum ada hasil.</pre>
    </div>
  </div>

  <script>
    const waStatusText = document.getElementById('wa-status');
    const qrSection = document.getElementById('qr-section');
    const qrContainer = document.getElementById('qr-container');
    const initBtn = document.getElementById('init-whatsapp');
    const checkBtn = document.getElementById('check-numbers-btn');
    const numbersInput = document.getElementById('numbers-input');
    const resultOutput = document.getElementById('result-output');

    let isInitializing = false;

    const pairSection = document.getElementById('pair-section');
    const generatePairBtn = document.getElementById('generate-pair');
    const confirmPairBtn = document.getElementById('confirm-pair');
    const pairCodeInput = document.getElementById('pair-code-input');
    const pairInfo = document.getElementById('pair-info');

    async function fetchJson(url, options = {}) {
      const res = await fetch(url, options);
      if (!res.ok) {
        const errorBody = await res.text();
        throw new Error(errorBody || res.statusText);
      }
      return res.json();
    }

    function formatResult(data) {
      if (!data) return 'Tidak ada data.';
      if (data.success === false) {
        return `Error: ${data.error || 'Tidak diketahui.'}`;
      }
      if (Array.isArray(data.results)) {
        return data.results.map((item, index) => `${index + 1}. ${item.input} → ${item.registered ? 'Terdaftar' : 'Tidak terdaftar'}`).join('\n');
      }
      return JSON.stringify(data, null, 2);
    }

    async function updateWhatsAppStatus() {
      try {
        const data = await fetchJson('/api/status');
        waStatusText.textContent = data.message || 'Status tidak tersedia.';
        initBtn.disabled = data.ready || isInitializing;
        initBtn.style.display = data.ready ? 'none' : 'inline-block';
        if (data.qrAvailable) {
          await loadQr();
        } else {
          qrSection.style.display = 'none';
          qrContainer.innerHTML = '';
        }
      } catch (err) {
        waStatusText.textContent = 'Gagal mengambil status: ' + err.message;
      }
    }

    async function loadQr() {
      try {
        const data = await fetchJson('/api/qr');
        if (data.qr) {
          qrSection.style.display = 'block';
          qrContainer.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=${encodeURIComponent(data.qr)}" alt="QR Code" />`;
        } else {
          qrSection.style.display = 'none';
          qrContainer.innerHTML = '';
        }
        // pairing info
        if (data.pairing) {
          pairSection.style.display = 'block';
          pairInfo.textContent = `Kode pairing: ${data.pairing.code} (expires ${new Date(data.pairing.expires).toLocaleTimeString()})`;
        } else {
          pairInfo.textContent = 'Belum ada kode pairing.';
          if (!data.qr) pairSection.style.display = 'none';
        }
      } catch (err) {
        console.error('QR load error', err);
        qrSection.style.display = 'none';
        qrContainer.innerHTML = '';
      }
    }

    async function generatePair() {
      try {
        generatePairBtn.disabled = true;
        const data = await fetchJson('/api/pair');
        pairSection.style.display = 'block';
        pairInfo.textContent = `Kode pairing: ${data.code} (expires ${new Date(data.expiresAt).toLocaleTimeString()})`;
        setTimeout(() => updateWhatsAppStatus(), 1000);
      } catch (err) {
        alert('Gagal membuat kode pairing: ' + err.message);
      } finally {
        generatePairBtn.disabled = false;
      }
    }

    async function confirmPair() {
      const code = pairCodeInput.value.trim();
      if (!code) return alert('Masukkan kode pairing terlebih dahulu.');
      try {
        confirmPairBtn.disabled = true;
        const res = await fetchJson('/api/pair/confirm', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });
        if (res.success) {
          pairInfo.textContent = 'Pairing berhasil.';
          pairCodeInput.value = '';
          setTimeout(() => updateWhatsAppStatus(), 500);
        } else {
          alert('Gagal konfirmasi: ' + (res.error || 'Unknown'));
        }
      } catch (err) {
        alert('Gagal konfirmasi pairing: ' + err.message);
      } finally {
        confirmPairBtn.disabled = false;
      }
    }

    async function initWhatsApp() {
      if (isInitializing) return;
      isInitializing = true;
      initBtn.disabled = true;
      initBtn.textContent = 'Menyiapkan...';
      waStatusText.textContent = 'Menjalankan inisialisasi...';

      try {
        await fetchJson('/api/initialize', { method: 'POST' });
      } catch (err) {
        console.error('Initialize error:', err);
      } finally {
        isInitializing = false;
        initBtn.textContent = 'Inisialisasi WhatsApp';
        await updateWhatsAppStatus();
      }
    }

    async function checkNumbers() {
      const raw = numbersInput.value.trim();
      if (!raw) {
        resultOutput.textContent = 'Masukkan nomor terlebih dahulu.';
        return;
      }
      const numbers = raw.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
      if (numbers.length === 0) {
        resultOutput.textContent = 'Masukkan nomor yang valid.';
        return;
      }
      checkBtn.disabled = true;
      checkBtn.textContent = 'Memeriksa...';
      resultOutput.textContent = 'Sedang memeriksa...';

      try {
        const data = await fetchJson('/api/check-numbers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ numbers }),
        });
        resultOutput.textContent = formatResult(data);
      } catch (err) {
        resultOutput.textContent = 'Gagal mengecek nomor: ' + err.message;
      } finally {
        checkBtn.disabled = false;
        checkBtn.textContent = 'Cek Nomor';
      }
    }

    initBtn.addEventListener('click', initWhatsApp);
    checkBtn.addEventListener('click', checkNumbers);
    generatePairBtn.addEventListener('click', generatePair);
    confirmPairBtn.addEventListener('click', confirmPair);

    setInterval(updateWhatsAppStatus, 5000);
    updateWhatsAppStatus();
  </script>
</body>
</html>
